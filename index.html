<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teatro EAC — Paróquia de Santo Antônio</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎭%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a href="#/" class="brand">
        <span class="brand-mask">🎭</span>
        <span class="brand-text">
          <strong>Teatro EAC</strong>
          <small>Encontro de Adolescentes com Cristo · Paróquia de Santo Antônio</small>
        </span>
      </a>
      <nav class="top-nav">
        <a href="#/" data-nav="home">Início</a>
        <a href="#/pecas" data-nav="pecas">Peças</a>
        <a href="#/personagens" data-nav="personagens">Personagens</a>
        <a href="#/ensaiar" data-nav="ensaiar">Ensaiar</a>
        <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">🌙</button>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <footer class="footer">
    <div class="wrap">
      <span>🎭 Estou a caminho — Teatro EAC</span>
    </div>
  </footer>

  <script>
    // Cache-buster: força o navegador a buscar sempre a versão mais nova
    // desses arquivos. Assim, quando o elenco (config.js) ou o roteiro
    // (data.js) mudam, a atualização aparece na hora — sem precisar limpar
    // o cache do celular.
    (function () {
      var v = Date.now();
      ['config.js', 'data.js', 'app.js'].forEach(function (src) {
        document.write('<script src="' + src + '?v=' + v + '"><\/script>');
      });
    })();
  </script>
</body>
</html>
